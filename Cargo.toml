[package]
name = "galengine"
version = "0.1.0"
edition = "2021"
description = "通用 galgame 引擎（Rust+SDL2）——首个客户：《第八个夏天》"

[dependencies]
sdl2 = { version = "0.37", features = ["image", "ttf", "mixer"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

[profile.release]
opt-level = 3
lto = true
strip = true
