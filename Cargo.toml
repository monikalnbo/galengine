[package]
name = "galengine"
version = "0.1.0"
edition = "2021"
description = "数据驱动的通用 galgame / 视觉小说引擎（Rust + SDL2）"
license = "MIT"
repository = "https://github.com/monikalnbo/galengine"
keywords = ["game-engine", "visual-novel", "galgame", "sdl2"]

[dependencies]
sdl2 = { version = "0.37", features = ["image", "ttf", "mixer"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

[profile.release]
opt-level = 3
lto = true
strip = true
