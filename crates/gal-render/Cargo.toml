[package]
name = "gal-render"
description = "galgame 引擎·渲染层：离屏合成/letterbox/纹理库/预解码"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
sdl2.workspace = true
image.workspace = true
gal-config.workspace = true
gal-script.workspace = true

[features]
# v0.3.8 视频子系统（默认关）：ffmpeg-sidecar 子进程解码帧 → SDL texture
video = ["dep:ffmpeg-sidecar"]

[dependencies.ffmpeg-sidecar]
version = "2.7.0"
optional = true
default-features = false
