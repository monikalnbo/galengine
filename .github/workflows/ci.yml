# 引擎持续集成（每次 push / PR）：语法规范（fmt + clippy）+ 全量编译 + 测试兜底
# 语法规范是硬性需求（需求书二-10：报错中文+行号；每步 cargo build 零警告）。
# 发布（tag v* → Windows 演示包）见 build-windows.yml（本文件不重复出包）。

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  lint:
    name: fmt + clippy（零警告）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install SDL2 dev（Linux 运行时链接）
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev libsdl2-mixer-dev
      - name: cargo fmt --check
        run: cargo fmt --check
      - name: cargo clippy -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

  build-test:
    name: 全量编译 + 测试
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install SDL2 dev
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev libsdl2-mixer-dev
      - name: cargo build --workspace
        run: cargo build --workspace
      - name: cargo test --workspace
        run: cargo test --workspace
