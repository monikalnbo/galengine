name: Release Windows Demo

# 打 tag（v*）→ 构建对应版本的 Windows 演示包并发布 Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  SDL2_VER: "2.30.0"
  SDL2_IMAGE_VER: "2.8.2"
  SDL2_TTF_VER: "2.22.0"
  SDL2_MIXER_VER: "2.8.0"

jobs:
  build-windows-x64:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install mingw cross toolchain
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gcc-mingw-w64-x86-64
          rustup target add x86_64-pc-windows-gnu

      # 官方预编译 mingw 库（bundled 特性不支持 image/ttf/mixer 伴生库，故走预编译）
      - name: Fetch prebuilt SDL2 (mingw)
        run: |
          set -e
          mkdir -p /tmp/sdl2mingw/lib /tmp/sdl2mingw/bin
          dl() {
            curl -sL --retry 3 -o "devel.tar.gz" "$1"
            tar xzf devel.tar.gz
          }
          dl "https://github.com/libsdl-org/SDL/releases/download/release-${SDL2_VER}/SDL2-devel-${SDL2_VER}-mingw.tar.gz"
          dl "https://github.com/libsdl-org/SDL_image/releases/download/release-${SDL2_IMAGE_VER}/SDL2_image-devel-${SDL2_IMAGE_VER}-mingw.tar.gz"
          dl "https://github.com/libsdl-org/SDL_ttf/releases/download/release-${SDL2_TTF_VER}/SDL2_ttf-devel-${SDL2_TTF_VER}-mingw.tar.gz"
          dl "https://github.com/libsdl-org/SDL_mixer/releases/download/release-${SDL2_MIXER_VER}/SDL2_mixer-devel-${SDL2_MIXER_VER}-mingw.tar.gz"
          cp SDL2-*/x86_64-w64-mingw32/lib/*.a /tmp/sdl2mingw/lib/
          cp SDL2-*/x86_64-w64-mingw32/bin/*.dll /tmp/sdl2mingw/bin/
          cp SDL2_image-*/x86_64-w64-mingw32/lib/*.a /tmp/sdl2mingw/lib/
          cp SDL2_image-*/x86_64-w64-mingw32/bin/*.dll /tmp/sdl2mingw/bin/
          cp SDL2_ttf-*/x86_64-w64-mingw32/lib/*.a /tmp/sdl2mingw/lib/
          cp SDL2_ttf-*/x86_64-w64-mingw32/bin/*.dll /tmp/sdl2mingw/bin/
          cp SDL2_mixer-*/x86_64-w64-mingw32/lib/*.a /tmp/sdl2mingw/lib/
          cp SDL2_mixer-*/x86_64-w64-mingw32/bin/*.dll /tmp/sdl2mingw/bin/

      - name: Build (cargo cross)
        run: cargo build --release --target x86_64-pc-windows-gnu
        env:
          RUSTFLAGS: "-L native=/tmp/sdl2mingw/lib"

      # 包结构：exe + 4×SDL2 DLL + game/（演示数据 data 目录，双击即玩）
      - name: Assemble package
        run: |
          set -e
          VER="${GITHUB_REF_NAME:-manual}"
          mkdir -p dist/game
          cp target/x86_64-pc-windows-gnu/release/galengine.exe dist/
          cp /tmp/sdl2mingw/bin/SDL2*.dll dist/
          # 官方 mingw DLL 未去调试符号（ttf 高达 68MB），剥离后体积正常
          x86_64-w64-mingw32-strip --strip-debug dist/*.dll || true
          cp -r crates/gal-engine/testdata/game/data dist/game/data
          rm -rf dist/game/data/savedata
          cd dist && 7z a -tzip "../galengine-demo-windows-x64-${VER}.zip" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: galengine-demo-windows-x64
          path: galengine-demo-windows-x64-*.zip

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: galengine-demo-windows-x64-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
